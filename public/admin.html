<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-
scale=1.0">

<title>Catálogo de Tienda</title>
<link rel="stylesheet" href="css/styles1.css">
</head>
<body>
<div class="container">
    <header>
        
        <h1 style="color: #efb036">Gestion del catálogo</h1>
        <!-- HAMBURGUESA -->
<nav class="navbar">
    <div class="menu-toggle" id="menu-toggle">&#9776;</div>
    <ul class="menu" id="menu">
      <li><button id="usuario-btn">Usuario</button></li>
      <li>
        <button id="admin-btn">Administrador</button>
        <div id="admin-form" class="hidden">
          <input type="text" id="admin-user" placeholder="Usuario" />
          <input type="password" id="admin-pass" placeholder="Contraseña" />
          <button id="admin-login">Ingresar</button>
        </div>
      </li>
    </ul>
  </nav>
  <!-- HAMBURGUESA -->
         
        <!-- Botón para ir al Catálogo -->
        <nav>
            <a href="index.html" class="boton">Catálogo</a>
        </nav>
    </header>
    <div class="formulario-producto">
        <h2>Agregar/Editar Producto</h2>
        <form id="form-producto">
            <input type="hidden" id="producto-id"> <!-- Campo oculto para el ID en edición -->
            <div class="form-group">
                <label for="nombre">Nombre del Producto:</label>
                <input type="text" id="nombre" required>
            </div>
            <div class="form-group">
                <label for="descripcion">Descripción:</label>
                <textarea id="descripcion" rows="3" required></textarea>
            </div>
            <div class="form-group">
                <label for="precio">Precio:</label>
                <input type="number" id="precio" min="0" step="0.01" required>
            </div>
            <div class="form-group">
                <label for="imagen">Imagen del Producto:</label>
                <input type="file" id="imagen" accept="image/*">
                <div id="preview-imagen"></div> <!-- Para previsualizar la imagen -->
            </div>
            <div class="form-group">
                <label for="rebaja">
                    <input type="checkbox" id="rebaja"> Producto en rebaja
                </label>
            </div>
            <div class="form-buttons">
                <button type="submit" id="btn-guardar">Guardar Producto</button>
                <button type="button" id="btn-cancelar" style="display: none;">Cancelar Edición</button>
            </div>
        </form>
    </div>
    <div class="catalogo-productos">
        <h2>Productos en Catálogo</h2>
        <div id="lista-productos">
        <!-- Aquí se mostrarán los productos -->
        </div>
    </div>
    <div class="acerca-de-seccion">
        <h2>Acerca de la Compañía</h2>
        <div id="footer-acerca"></div>
    </div>
</div>
<script src="js/admin-scriptSQL.js"></script>
</body>
</html>
