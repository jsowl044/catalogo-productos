<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-
scale=1.0">
<!-- CSS de Splide -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.0.7/dist/css/splide.min.css">
<!-- JS de Splide -->
<script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.0.7/dist/js/splide.min.js"></script>
<title>Catálogo de Productos</title>
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>
<header>
<h1 style ="color: #efb036">Catálogo de Productos</h1>
<!-- HAMBURGUESA -->
<nav class="navbar" id="burger">
  <div class="menu-toggle" id="menu-toggle">&#9776;</div>
  <ul class="menu" id="menu">
    <li><button id="usuario-btn">Usuario</button></li>
    <li>
      <button id="admin-btn">Administrador</button>
      <div id="admin-form" class="hidden">
        <input type="text" id="admin-user" placeholder="Usuario" />
        <input type="password" id="admin-pass" placeholder="Contraseña" />
        <button id="admin-login">Ingresar</button>
      </div>
    </li>
  </ul>
  <img src="../public/assets/logo.png" alt="" style="width: 10%;">
</nav>
<!-- HAMBURGUESA -->

<!-- Barra de búsqueda -->
<input type="text" id="buscador" placeholder="Buscar productos...">
<!-- Botón para ir al CRUD -->
<nav>
  <a href="admin.html" class="boton">CRUD</a>
</nav>
</header>
<!-- Carrousel -->
<section id="image-carousel" class="splide" aria-label="Carrusel de imágenes">
    <div class="splide__track">
      <ul class="splide__list">
        <!-- Las imágenes se agregarán dinámicamente aquí -->
      </ul>
    </div>
  </section>
<main id="contenedor-productos">
<!-- Aquí se insertarán los productos dinámicamente con JavaScript-->
</main>
<footer>
  <div class="social-icons">
    <a href="https://facebook.com" target="_blank">
      <img style="height:40px;"src="./assets/facebook1.png" alt="Facebook" />
    </a>
    <a href="https://wa.me/1234567890" target="_blank">
      <img style="height: 40px;"src="./assets/whatsapp.png" alt="WhatsApp" />
    </a>
    <a href="https://x.com" target="_blank">
      <img  style="height: 40px;" src="./assets/Untitled design (7).png" alt="X" />
    </a>
  </div>
<p style="color: white">© 2024 Mi Catálogo de Productos</p>
<div id="footer-acerca"></div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.0.7/dist/js/splide.min.js"></script>
<script src="./js/script.js"></script>
</body>
</html>
